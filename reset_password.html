<!DOCTYPE html>
<html>
<head><title>Reset Password</title></head>
<body>
<h2>Reseteando password...</h2>
<pre id="output">Ejecutando...</pre>
<script>
(async () => {
  const out = document.getElementById('output');
  try {
    const res = await fetch('http://localhost:4000/api/auth/dev_reset_password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: 'cmartinez@ingensoft.es', password: 'Valencia170'})
    });
    const data = await res.text();
    out.textContent = 'Status: ' + res.status + '\nResponse: ' + data;
    if (res.ok) {
      out.textContent += '\n\nPassword reseteada correctamente. Probando login...';
      const loginRes = await fetch('http://localhost:4000/api/auth/signin', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: 'cmartinez@ingensoft.es', password: 'Valencia170'})
      });
      const loginData = await loginRes.text();
      out.textContent += '\nLogin status: ' + loginRes.status + '\nLogin response: ' + loginData;
      if (loginRes.ok) {
        out.textContent += '\n\n*** LOGIN EXITOSO! Redirigiendo en 3 segundos... ***';
        const token = JSON.parse(loginData);
        document.cookie = 'token=' + token.accessToken + '; path=/';
        document.cookie = 'organization_id=' + token.organizationId + '; path=/';
        document.cookie = 'tenant_id=' + token.tenantId + '; path=/';
        setTimeout(() => window.location.href = 'http://localhost:4000/', 3000);
      }
    }
  } catch(e) {
    out.textContent = 'Error: ' + e.message;
  }
})();
</script>
</body>
</html>
